[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krakken-ai"
version = "0.1.0"
description = "A futuristic AI desktop assistant built with Python, Qt, voice AI, and tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles==25.1.0",
    "groq==1.6.0",
    "httpx==0.28.1",
    "kokoro==0.9.4",
    "loguru==0.7.3",
    "numpy==2.2.6",
    "orjson==3.11.9",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "PySide6==6.11.1",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "sounddevice==0.5.5",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
